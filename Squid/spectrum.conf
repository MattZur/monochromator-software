[required]
acquisition      = 'spectrum'
keithley_model   = 6487
save_name        = 'test'

[optional]
overwrite        = False
num_samples      = 1
sipm_bias        = 53

# coarse sweep (inclusive of angle_stop)
include_coarse   = True
angle_start      = 3.4
angle_stop       = 3.6
angle_step       = 0.1

# extra fine ranges as (start, stop, step); [] for none.
# with include_coarse = False only these are scanned
fine_ranges      = [(1.2, 1.6, 0.01), (11.5, 12.4, 0.01)]