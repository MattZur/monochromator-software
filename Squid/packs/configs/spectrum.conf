[required]
acquisition      = 'spectrum'
keithley_model   = 6487
save_name        = 'test'

[optional]
overwrite        = False
num_samples      = 100
sipm_bias        = 53

# coarse sweep (inclusive of angle_stop)
include_coarse   = True
angle_start      = 3.8
angle_stop       = 6.8
angle_step       = 0.1

# extra fine ranges as (start, stop, step); [] for none.
# with include_coarse = False only these are scanned
# ex. fine_ranges      = [(1.2, 1.6, 0.01), (11.5, 12.4, 0.01)]
fine_ranges	 = [(4.3, 4.4, 0.1)] 
